[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbiton-desktop"
version = "0.8.0"
description = "A Python desktop voice assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "SpeechRecognition>=3.10.0",
    "edge-tts>=6.1.0",
    "pygame>=2.5.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
orbiton = "stag.app:main"

[tool.setuptools.packages.find]
include = ["stag*"]
