name: Bandit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "39 14 * * 1"

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Bandit
        run: python -m pip install --upgrade bandit
      - name: Scan troubleshooter
        run: bandit -ll -r troubleshooter.py stag/ -f txt
